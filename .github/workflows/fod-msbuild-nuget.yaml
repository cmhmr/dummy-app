name: FOD MsBuild with NuGet
description: FOD MsBuild with NuGet
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - MS-SecurityIssues_2
    paths:
      - 'iMotion/**'
  pull_request:
    branches:
      - MS-SecurityIssues_2
    types: 
      - opened
      - synchronize
    paths:
      - 'iMotion/**'
permissions:
  contents: read
  security-events: write
jobs:
  ast:
    uses: cmhmr/workflows-library/.github/workflows/run-fod-msbuild.yaml@main
    # uses: ASOD/workflows-library/.github/workflows/run-fod-python.yaml@main
    secrets: inherit
    with:
      runner-version: windows-2022
      checkout-paths: iMotion
      sln-name: "iMotion/SampleApp.sln"
      release-name: ${{ github.ref_name }} # Or suggested releases names: Dev|Stage|Prod
      sdlc-status: "Development" # Possible values: Development (default), Production, QA, Retired
      # application-type: "Web" # [Web(default), ThickClient, Mobile, Microservice]
      # application-criticality: "Medium" # High, Medium (default), Low
      # entitlement-frequency: "Subscription(default)|SingleScan"
      package-extra-opts: |
        -include="**/bin/**"
        -include="**/packages/**"
        -include="**/obj/**"
        -include="**/vendor/**"

 
